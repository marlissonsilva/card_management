name: CI - Validação Inicial

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validation:
    name: Lint, Build and Validation Prisma
    runs-on: ubuntu-latest

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Database (docker compose)
        run: docker-compose up -d

      - name: Waith Database
        run: sleep 5

      - name: Bun config
        uses: oven-sh/setup-bun@v1

      - name: Install Dependencies
        run: bun install

      - name: Prisma Client generate
        run: bunx prisma generate

      - name: Sync Database temp
        run: bunx prisma db push
        env:
          DATABASE_URL: "postgres://docker:docker@localhost:5433/card_db?schema=public"

      - name: Run linter
        run: bun run linter

      - name: Build
        run: bun run build
        env:
          DATABASE_URL: "postgres://docker:docker@localhost:5433/card_db?schema=public"
